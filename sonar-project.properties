# SonarQube project for the XPD-SonarQube stack repository.
# The only application code here is the env generator script (scripts/);
# the backup sidecar is now a thin meta-layer on the central BackupHelper
# image, so no Python backup sources live in this repo. Everything else is
# Docker / Compose / CI / docs.
sonar.projectKey=bauer-group_XPD-SonarQube_a73851b3-fc1d-4c14-b0b3-c80e5f0f3b04
sonar.projectName=XPD-SonarQube
sonar.sources=scripts
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Exclude build artefacts / caches
sonar.exclusions=**/__pycache__/**,**/*.pyc

# Coverage is OFF here (Level A — analysis only) to stay on the reusable
# workflow without a hand-rolled test job. To add coverage, switch to Level B
# (see docs/ci-integration.md) and uncomment:
# sonar.python.coverage.reportPaths=scripts/coverage.xml
