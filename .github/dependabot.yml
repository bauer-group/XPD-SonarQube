# =============================================================================
# Dependabot Configuration
# =============================================================================
# Watches:
#   1. GitHub Actions versions (workflows pinned to @main pull module updates)
#   2. Image references inside docker-compose*.yml files
#   3. Base images inside the two Dockerfiles
#
# The backup sidecar has no Python requirements of its own: it is built FROM
# the central BackupHelper engine image, whose dependencies are maintained in
# that repository.
#
# Commit prefixes decide what a merged update releases (semantic-release):
#   docker, docker-compose  fix(docker) - the images and the compose files
#                           operators run; a merge cuts a PATCH release
#   github-actions          chore(ci)   - CI only, no release (and never
#                           merged automatically)
# docker-maintenance.yml merges tested patch updates and dispatches the release.
#
# Pure digest drift on existing floating tags is handled by check-base-images.yml
# (daily cron). The SonarQube ↔ branch-plugin version pair is resolved by the
# resolve-versions job of docker-release.yml on every build (see
# docs/upgrade.md) — Dependabot does not track the GitHub-release JAR.
# =============================================================================

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "dependabot"
    commit-message:
      prefix: "chore(ci)"

  # Docker Compose images (postgres, busybox, the wrapper images)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # sonarqube wrapper base image (sonarqube:<ver>-community in src/sonarqube/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/src/sonarqube"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"

  # sonarqube-backup base image (FROM the central BackupHelper image in src/sonarqube-backup/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/src/sonarqube-backup"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:30"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
      - "dependabot"
    commit-message:
      prefix: "fix(docker)"
