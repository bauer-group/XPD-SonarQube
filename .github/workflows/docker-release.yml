name: 🚀 Release & Docker Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - 'tests/backup-roundtrip/**'
      - '.github/workflows/docker-release.yml'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main: a declared permissions: block sets every
  # unlisted scope to none, and the reusable workflow now needs these three.
  attestations: write   # write the build-provenance attestation
  id-token: write       # OIDC token to sign the attestation (keyless/Sigstore)
  actions: read         # its nested security-analysis job reads run metadata

# Serialize release runs on a branch so concurrent runs never race on the
# semantic-release git push (the "rejected push loop"). Queue, never cancel —
# an in-flight publish must finish, and a waiting run (e.g. the release the
# Dependabot maintenance dispatched and waits for) must not be replaced by a
# newer one: queue: max keeps up to 100 pending runs instead of only one.
concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  # ============================================
  # Validation Jobs
  # ============================================

  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.coolify.yml", "docker-compose.traefik.yml", "docker-compose.development.yml"]'
      env-file: '.env.example'
      validate-services: '["postgres", "sonarqube"]'

  validate-scripts:
    name: 🔍 Validate Shell Scripts
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-shellscript.yml@main
    with:
      scan-directory: '.'
      severity: 'error'

  # ============================================
  # Resolve the newest plugin-compatible SonarQube version
  # ============================================
  # The Community Branch Plugin is version-locked to SonarQube, and the floating
  # `community` tag often runs ahead of the plugin's releases. So we float on the
  # PLUGIN: take its latest release, then pick the newest matching SonarQube
  # `<MAJOR.MINOR>.*-community` tag and pass it as a build-arg. This keeps the
  # build green and always on the newest WORKING pair — no manual pinning.

  resolve-versions:
    name: 🧭 Resolve SonarQube + plugin pair
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only: it only asks GitHub and Docker Hub. The pair is written into
    # the Dockerfile by pin-versions, once the round trips passed with it.
    permissions:
      contents: read
    outputs:
      build-args: ${{ steps.r.outputs.build-args }}
      sonarqube-version: ${{ steps.r.outputs.sonarqube-version }}
      plugin-version: ${{ steps.r.outputs.plugin-version }}
    steps:
      - id: r
        shell: bash
        env:
          # This job gates every release (backup-roundtrip needs it). Without a
          # token the GitHub API allows 60 requests per hour per IP, shared by
          # everything else on the hosted runner's IP; gh authenticates with
          # this token instead (1,000 requests per hour for the repository).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          plugin="$(gh api repos/mc1arke/sonarqube-community-branch-plugin/releases/latest --jq '.tag_name')"
          minor="$(printf '%s' "$plugin" | cut -d. -f1-2)"
          # Docker Hub has no token here: --retry rides out a 429 or 5xx.
          sq="$(curl -fsSL --retry 3 "https://hub.docker.com/v2/repositories/library/sonarqube/tags?page_size=100&name=${minor}." \
                | jq -r '.results[].name' \
                | grep -E "^${minor}\.[0-9.]+-community$" | sort -V | tail -1)"
          if [ -z "$plugin" ] || [ -z "$sq" ]; then
            echo "::error::could not resolve a SonarQube tag for plugin ${plugin:-<none>} (minor ${minor:-<none>})"
            exit 1
          fi
          echo "Resolved pair: SonarQube=${sq}  branch-plugin=${plugin}"

          # Every build and test of this run checks out the trigger commit and
          # receives the pair as build-args. docker/build-push-action expects
          # newline-separated KEY=VALUE pairs.
          {
            echo "build-args<<__ARGS__"
            echo "SONARQUBE_VERSION=${sq}"
            echo "BRANCH_PLUGIN_VERSION=${plugin}"
            echo "__ARGS__"
            echo "sonarqube-version=${sq}"
            echo "plugin-version=${plugin}"
          } >> "$GITHUB_OUTPUT"

  # ============================================
  # Backup round trip (gates every release)
  # ============================================
  # Builds both images from this commit - SonarQube with the plugin pair
  # resolve-versions picked, the sidecar FROM the newest BackupHelper engine -
  # starts the Coolify stack with the backup profile on fresh volumes, creates
  # a project through the SonarQube API, backs it up, deletes it, restores the
  # snapshot and checks that PostgreSQL, the API and the Projects page (search
  # index) have it back. The second job below does the same as an upgrade with
  # an off-site copy, per compose variant; the release needs both. Every
  # release rebuilds the images from the newest bases - also the one the base
  # image monitor dispatches - so both run on every push, dispatch and
  # relevant PR. Docs-only pushes never reach them (paths-ignore).

  backup-roundtrip:
    name: 🧪 Backup Round Trip
    needs: [validate-compose, validate-scripts, resolve-versions]
    permissions:
      contents: read
      packages: read
    uses: bauer-group/automation-templates/.github/workflows/modules-backup-roundtrip-test.yml@main
    with:
      # No published ports and no external proxy network: the Coolify variant
      # runs on a plain runner as it is.
      compose-file: 'docker-compose.coolify.yml'
      profiles: 'backup'
      env-overrides: |
        STACK_NAME=sonarqube_roundtrip
      generated-secrets: 'POSTGRES_PASSWORD'
      # toJSON() turns the newline-separated build-args into a JSON string.
      build-images: |
        [
          {"service": "sonarqube", "context": "src/sonarqube",
           "build-args": ${{ toJSON(needs.resolve-versions.outputs.build-args) }}},
          {"service": "sonarqube-backup", "context": "src/sonarqube-backup"}
        ]
      backup-service: 'sonarqube-backup'
      # The postgres source is named after the database (POSTGRES_DB).
      require-components: 'sonar'
      services-to-stop-before-restore: 'sonarqube'
      seed-script: 'tests/backup-roundtrip/seed.sh'
      mutate-script: 'tests/backup-roundtrip/mutate.sh'
      check-script: 'tests/backup-roundtrip/check.sh'
      # First boot runs the database migrations and builds the search indexes.
      wait-timeout: 900
      # free-disk-space stays off: the stack needs under 5 GB (3.8 GB images,
      # 0.9 GB volumes) on a runner with 87 GB free; freeing more costs 2 min.
    secrets: inherit

  # The way production gets there, once per compose variant operators deploy:
  # the latest release (sonarqube and sonarqube-backup images) starts, seeds a
  # project and backs it up - also to an S3 bucket (a throwaway MinIO). Then
  # the stack is upgraded to the images built from this commit like an
  # operator does (images switched, compose up -d); the project must survive
  # it and the new sidecar must be healthy with the old snapshot. The project
  # is deleted, the sidecar's data volume is wiped like on a new host, and the
  # new sidecar restores the old snapshot from S3. The Traefik file joins the
  # external proxy network, which is created for the run.
  backup-roundtrip-upgrade:
    name: 🧪 Backup Round Trip (upgrade, S3, ${{ matrix.variant }})
    needs: [validate-compose, validate-scripts, resolve-versions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: coolify
            compose-file: docker-compose.coolify.yml
          - variant: traefik
            compose-file: docker-compose.traefik.yml
    permissions:
      contents: read
      packages: read
    uses: bauer-group/automation-templates/.github/workflows/modules-backup-roundtrip-test.yml@main
    with:
      compose-file: ${{ matrix.compose-file }}
      profiles: 'backup'
      env-overrides: |
        STACK_NAME=sonarqube_roundtrip
      generated-secrets: 'POSTGRES_PASSWORD'
      build-images: |
        [
          {"service": "sonarqube", "context": "src/sonarqube",
           "build-args": ${{ toJSON(needs.resolve-versions.outputs.build-args) }}},
          {"service": "sonarqube-backup", "context": "src/sonarqube-backup"}
        ]
      backup-service: 'sonarqube-backup'
      require-components: 'sonar'
      services-to-stop-before-restore: 'sonarqube'
      seed-script: 'tests/backup-roundtrip/seed.sh'
      mutate-script: 'tests/backup-roundtrip/mutate.sh'
      check-script: 'tests/backup-roundtrip/check.sh'
      # Both images start as the latest release (vX.Y.Z -> image tag X.Y.Z)
      # and are upgraded to this commit's builds.
      upgrade-from: 'latest-release'
      # A newer SonarQube waits in DB_MIGRATION_NEEDED (unhealthy) until the
      # operator starts the migration on /setup (docs/upgrade.md). The script
      # starts a watcher that does that step - at the upgrade and after the
      # restore of the old snapshot - and nothing else.
      upgrade-script: 'tests/backup-roundtrip/upgrade.sh'
      # setting VARIABLE: the .env variables the compose files build the S3
      # destination from. The engine addresses buckets path-style by default.
      s3-destination: true
      s3-env: |
        endpoint   SONARQUBE_BACKUP_S3_ENDPOINT
        bucket     SONARQUBE_BACKUP_S3_BUCKET
        access-key SONARQUBE_BACKUP_S3_ACCESS_KEY
        secret-key SONARQUBE_BACKUP_S3_SECRET_KEY
      # PROXY_NETWORK of the Traefik file; the Coolify file declares none.
      external-networks: 'auto'
      wait-timeout: 900
      # free-disk-space stays off: the previous release's images at most
      # double the fresh gate's 3.8 GB, far below the runner's free disk.
      # Two boots of SonarQube, and the upgrade and the restart after the
      # restore may each wait for a database migration.
      timeout-minutes: 60
      artifact-name: 'backup-roundtrip-upgrade-${{ matrix.variant }}-diagnostics'
    secrets: inherit

  # ============================================
  # Pin the tested pair into the Dockerfile (main only)
  # ============================================
  # Keeps the Dockerfile the single source of truth (published == file), and
  # only with a pair the round trips above passed with. The commit goes on top
  # of the commit this run tested and is pushed as a fast-forward only: its
  # one change is the two ARG defaults, which every build and test of this
  # run received as build-args, so releasing it releases what was tested. If
  # main moved during the run, nothing is pinned and the release below
  # publishes nothing (main is ahead of what this run tested) - the run of
  # the newer commit pins and releases both. GITHUB_TOKEN pushes start no
  # workflow, so this never loops. On any other branch (a test dispatch)
  # nothing is written.
  pin-versions:
    name: 📌 Pin tested SonarQube + plugin pair
    needs: [validate-compose, validate-scripts, resolve-versions, backup-roundtrip, backup-roundtrip-upgrade]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.resolve-versions.result == 'success' &&
      needs.backup-roundtrip.result == 'success' &&
      needs.backup-roundtrip-upgrade.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release-ref: ${{ steps.pin.outputs.release-ref }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: pin
        shell: bash
        env:
          # Pass values through the environment - never interpolate them into
          # the script body (GitHub Actions script injection).
          SONARQUBE_VERSION: ${{ needs.resolve-versions.outputs.sonarqube-version }}
          BRANCH_PLUGIN_VERSION: ${{ needs.resolve-versions.outputs.plugin-version }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # The commit the release tags: the tested one, or the pin on top of it.
          release_ref="$GITHUB_SHA"
          df="src/sonarqube/Dockerfile"
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Not main ($REF) - nothing is pinned (and semantic-release releases from main only)."
          else
            sed -i -E "s|^(ARG SONARQUBE_VERSION=).*|\1${SONARQUBE_VERSION}|" "$df"
            sed -i -E "s|^(ARG BRANCH_PLUGIN_VERSION=).*|\1${BRANCH_PLUGIN_VERSION}|" "$df"
            if git diff --quiet -- "$df"; then
              echo "Dockerfile already at the tested pair - nothing to commit."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$df"
              git commit -m "chore: pinned SonarQube ${SONARQUBE_VERSION} + branch-plugin ${BRANCH_PLUGIN_VERSION} [skip ci]"
              if git push origin "HEAD:refs/heads/main"; then
                release_ref="$(git rev-parse HEAD)"
                echo "Pinned as ${release_ref}"
              elif [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
                echo "::warning title=Pair not pinned::main moved during this run - this run releases nothing; the run of the newer commit pins and releases."
              else
                echo "::error title=Pair not pinned::the push to main was rejected although main is still at the tested commit"
                exit 1
              fi
            fi
          fi
          echo "release-ref=${release_ref}" >> "$GITHUB_OUTPUT"

  # ============================================
  # Release Job (main: push or dispatch)
  # ============================================
  # Releases only after every gate passed, and only the commit this run
  # tested (ref) - semantic-release publishes nothing when main has moved
  # past it, and nothing from any branch but main.

  release:
    name: 📦 Create Semantic Release
    needs: [validate-compose, validate-scripts, resolve-versions, backup-roundtrip, backup-roundtrip-upgrade, pin-versions]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.resolve-versions.result == 'success' &&
      needs.backup-roundtrip.result == 'success' &&
      needs.backup-roundtrip-upgrade.result == 'success' &&
      needs.pin-versions.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      # github.sha, or the pin commit on top of it (see pin-versions).
      ref: ${{ needs.pin-versions.outputs.release-ref || github.sha }}
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # ============================================
  # Docker Build & Push (sonarqube wrapper image)
  # ============================================
  # SonarQube Community Build + Community Branch Plugin baked in.
  # Version pinning lives in src/sonarqube/Dockerfile ARG defaults.

  docker-build-sonarqube-release:
    name: 🐳 Build & Push sonarqube
    needs: [release, resolve-versions]
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/xpd-sonarqube/sonarqube'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './src/sonarqube/Dockerfile'
      docker-context: './src/sonarqube'
      platforms: 'linux/amd64'
      build-args: ${{ needs.resolve-versions.outputs.build-args }}

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: false
    secrets: inherit

  docker-build-sonarqube-pr:
    name: 🔨 Validate sonarqube Build (PR)
    needs: [validate-compose, validate-scripts, resolve-versions]
    if: |
      github.event_name == 'pull_request' &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/xpd-sonarqube/sonarqube'

      auto-tags: true
      dockerfile-path: './src/sonarqube/Dockerfile'
      docker-context: './src/sonarqube'
      platforms: 'linux/amd64'
      build-args: ${{ needs.resolve-versions.outputs.build-args }}

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit

  # ============================================
  # Docker Build & Push (sonarqube-backup image)
  # ============================================

  docker-build-backup-release:
    name: 🐳 Build & Push sonarqube-backup
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/xpd-sonarqube/sonarqube-backup'

      release-version: ${{ needs.release.outputs.version }}
      image-tags: 'stable'

      update-dockerfile-version: true
      auto-tags: true
      latest-tag: true

      dockerfile-path: './src/sonarqube-backup/Dockerfile'
      docker-context: './src/sonarqube-backup'
      platforms: 'linux/amd64'

      push: true

      security-scan: false
      security-fail-on: 'CRITICAL'
      generate-sbom: true
      sync-dockerhub-readme: false
    secrets: inherit

  docker-build-backup-pr:
    name: 🔨 Validate sonarqube-backup Build (PR)
    needs: [validate-compose, validate-scripts]
    if: |
      github.event_name == 'pull_request' &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: 'bauer-group/xpd-sonarqube/sonarqube-backup'

      auto-tags: true
      dockerfile-path: './src/sonarqube-backup/Dockerfile'
      docker-context: './src/sonarqube-backup'
      platforms: 'linux/amd64'

      push: false

      security-scan: false
      security-fail-on: 'CRITICAL'
    secrets: inherit
