# =============================================================================
# Dependabot Maintenance — Auto-merge tested Dependabot PRs
# =============================================================================
# Auto-approves and squash-merges a Dependabot patch or minor update —
# base-image bumps (Dockerfiles) and docker-compose image tags — once
# docker-release.yml (image builds and the backup round trip) has passed on
# the PR head commit and no other check failed. Major updates (a 0.x minor
# counts as major) stay open for review, and so do GitHub Action version
# bumps: they change the CI itself, so no CI run can vouch for them.
# A merge made with the GITHUB_TOKEN starts no push workflow, so after the
# merge this workflow dispatches docker-release.yml on main and waits for it
# (release-workflow). That run builds and tests the merged commit again and
# only then releases it and pushes the images; a release run that does not
# succeed turns this job red.
# Reference: bauer-group/automation-templates
# .github/workflows/docker-maintenance-dependabot.yml (header).
# =============================================================================

name: 🔧 Dependabot Maintenance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write       # merge
  pull-requests: write  # approve, read the PR
  checks: read          # check runs and suites of the PR head commit
  statuses: read        # commit statuses of the PR head commit
  actions: write        # dispatch the release; read workflow runs

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # Merge only after this PR CI has passed on the PR head commit - it
      # builds the images and runs the backup round trip.
      required-workflows: '.github/workflows/docker-release.yml'
      # After a merge - and only then - dispatch the release on main and
      # wait for it (release-wait-minutes, default 60): it rebuilds and
      # tests the merged commit before it releases it, and a failed release
      # run fails this job.
      release-workflow: '.github/workflows/docker-release.yml'
    secrets: inherit
