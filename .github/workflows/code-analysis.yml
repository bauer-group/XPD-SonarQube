# =============================================================================
# Code Quality — self-analysis via the shared reusable workflow
# =============================================================================
# Dogfoods this stack: the repo's own code (the Python backup sidecar) is
# analysed by SonarQube, reusing bauer-group/automation-templates rather than
# hand-rolling a scanner job. Project config lives in sonar-project.properties.
#
# Level A (analysis only) — no coverage, so no custom test job is duplicated.
# Tolerant: if the org secrets (SONARQUBE_TOKEN / SONARQUBE_HOST_URL) aren't
# granted to this repo yet, the scan logs a warning and skips (never fails).
# See docs/ci-integration.md.
# =============================================================================

name: 🔬 Code Quality

# Only changes the analysis can see trigger a scan (sonar.sources=scripts).
# Every push to main otherwise scanned this very SonarQube while it was
# unavailable (HTTP 502/503) - mostly on the empty base-image commits, which
# contain nothing to analyse.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'sonar-project.properties'
      - '.github/workflows/code-analysis.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'sonar-project.properties'
      - '.github/workflows/code-analysis.yml'
  workflow_dispatch:   # manual run, e.g. to validate the SonarQube connection

permissions:
  contents: read
  pull-requests: write   # lets SonarQube decorate the PR (branch plugin)

jobs:
  code-quality:
    name: 🔍 SonarQube Analysis
    uses: bauer-group/automation-templates/.github/workflows/modules-code-quality.yml@main
    with:
      enable-sonar: true
      # Use the runner's preinstalled JDK instead of downloading a JRE from
      # this server: the large JRE download kept being cut by the edge proxy
      # (HTTP/2 RST_STREAM), and the scanner cache is only saved after a
      # successful run, so every run had to download it again.
      args: -Dsonar.scanner.skipJreProvisioning=true
    secrets: inherit
